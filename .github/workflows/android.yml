name: Build Lingify APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Lingify_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          test -f Lingify_Project.zip || { echo "Lingify_Project.zip repoda yo'q"; exit 1; }
          unzip -q Lingify_Project.zip -d source
          find source -name gradlew -exec chmod +x {} \;

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          SETTINGS=$(find source -name "settings.gradle*" | head -n 1)
          cd "$(dirname "$SETTINGS")"
          if [ -f ./gradlew ]; then ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Lingify-APK
          path: source/**/build/outputs/apk/debug/*.apk
