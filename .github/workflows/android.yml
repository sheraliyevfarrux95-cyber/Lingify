name: Build Lingify APK

on:
workflow_dispatch:
push:
paths:
- 'Lingify_Project.zip'
- '.github/workflows/android.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract project
    run: |
      unzip -q Lingify_Project.zip -d source
      find source -name gradlew -exec chmod +x {} \;

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    run: |
      cd source/EnglishOrDieAndroid
      gradle assembleDebug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: Lingify-APK
      path: source/EnglishOrDieAndroid/app/build/outputs/apk/debug/app-debug.apk
